<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; base-uri 'none'; form-action 'none'">
  <meta name="color-scheme" content="dark light">
  <link rel="icon" href="data:,">
  <title>FocusKit</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="modules/today.css">
  <link rel="stylesheet" href="modules/tasks.css">
  <link rel="stylesheet" href="modules/board.css">
  <link rel="stylesheet" href="modules/matrix.css">
  <link rel="stylesheet" href="modules/planner.css">
  <link rel="stylesheet" href="modules/focus.css">
  <link rel="stylesheet" href="modules/study.css">
  <link rel="stylesheet" href="modules/stopwatch.css">
  <link rel="stylesheet" href="modules/history.css">
  <link rel="stylesheet" href="modules/metrics.css">
  <link rel="stylesheet" href="modules/calendar.css">
  <link rel="stylesheet" href="modules/habits.css">
  <link rel="stylesheet" href="modules/projects.css">
  <link rel="stylesheet" href="modules/dday.css">
  <link rel="stylesheet" href="modules/notes.css">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <!-- Shared gradient for progress rings (FK.ring). Not display:none, or the gradient stops resolving. -->
  <svg width="0" height="0" class="defs" aria-hidden="true" focusable="false">
    <defs><linearGradient id="fk-grad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" class="g-a"/><stop offset="1" class="g-b"/></linearGradient></defs>
  </svg>
  <div class="app" id="app">
    <aside class="sidebar" aria-label="Sidebar">
      <a class="brand" href="#today" aria-label="FocusKit home">
        <span class="logo" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="7.5"/><path d="M12 4.5a7.5 7.5 0 0 1 7.5 7.5"/><circle cx="12" cy="12" r="2.2" fill="currentColor" stroke="none"/></svg></span>
        <span class="brand-name">FocusKit</span>
      </a>
      <nav id="nav" class="nav" aria-label="Modules"></nav>
      <div class="side-foot">
        <a href="#settings" id="nav-settings" class="nav-item" title="Settings"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 6.5h9M17 6.5h3M4 12h3M11 12h9M4 17.5h11M19 17.5h1"/><circle cx="15" cy="6.5" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="17.5" r="2"/></svg><span class="nav-text">Settings</span></a>
        <button class="nav-item collapse-btn" data-click="fkSidebar" title="Collapse sidebar ([)" aria-label="Toggle sidebar"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9.5 4v16"/></svg><span class="nav-text">Collapse</span></button>
      </div>
    </aside>
    <div class="main-col">
      <header class="topbar">
        <h1 id="view-title" class="view-title"></h1>
        <div id="chip" class="chip-slot"></div>
        <button class="search-btn" data-click="fkPalette" aria-label="Open command palette" aria-keyshortcuts="Control+K Meta+K">
          <svg class="ico" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.6-3.6"/></svg>
          <span class="search-text">Search</span><kbd id="kbd-k">Ctrl K</kbd>
        </button>
        <button class="btn-icon btn-ghost" id="theme-btn" data-click="fkThemeToggle" aria-label="Toggle light and dark theme" title="Toggle theme">
          <svg class="ico theme-ico" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M20.5 14.1A8.5 8.5 0 1 1 9.9 3.5a7 7 0 0 0 10.6 10.6z"/></svg>
        </button>
        <button class="btn-icon btn-ghost" data-click="fkHelp" aria-label="Keyboard shortcuts" title="Keyboard shortcuts (?)">
          <svg class="ico" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="2.5" y="6" width="19" height="12" rx="2.5"/><path d="M6.5 10h.01M10 10h.01M14 10h.01M17.5 10h.01M7.5 14h9"/></svg>
        </button>
      </header>
      <main id="main" class="main" tabindex="-1"></main>
    </div>
  </div>

  <dialog id="palette" class="palette" aria-label="Command palette">
    <div class="pal-search">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.6-3.6"/></svg>
      <input id="pal-input" type="text" role="combobox" aria-expanded="true" aria-controls="pal-list" aria-autocomplete="list" aria-label="Command" autocomplete="off" spellcheck="false">
      <kbd>esc</kbd>
    </div>
    <ul id="pal-list" class="pal-list" role="listbox" aria-label="Results"></ul>
    <div class="pal-foot"><span><kbd>↑</kbd><kbd>↓</kbd> move</span><span><kbd>↵</kbd> run</span><span><kbd>esc</kbd> close</span></div>
  </dialog>
  <dialog id="modal" class="modal" aria-labelledby="modal-title"></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="live" class="sr-only" aria-live="polite"></div>

  <script src="core.js"></script>
  <script src="modules/today.js"></script>
  <script src="modules/tasks.js"></script>
  <script src="modules/board.js"></script>
  <script src="modules/matrix.js"></script>
  <script src="modules/planner.js"></script>
  <script src="modules/focus.js"></script>
  <script src="modules/study.js"></script>
  <script src="modules/stopwatch.js"></script>
  <script src="modules/history.js"></script>
  <script src="modules/metrics.js"></script>
  <script src="modules/calendar.js"></script>
  <script src="modules/habits.js"></script>
  <script src="modules/projects.js"></script>
  <script src="modules/dday.js"></script>
  <script src="modules/notes.js"></script>
  <script src="boot.js"></script>
</body>
</html>
